version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: reflow_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: reflow_api
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://reflow:reflow_password@postgres:5432/reflow
      - STORAGE_PROVIDER=local
      - STORAGE_DIR=/app/storage
      - REDIS_URL=redis://redis:6379/0
      - REDIS_MEDIA_QUEUE=reflow:media_jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: reflow_worker
    command: ["python", "worker.py"]
    volumes:
      - storage_data:/app/storage
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://reflow:reflow_password@postgres:5432/reflow
      - STORAGE_PROVIDER=local
      - STORAGE_DIR=/app/storage
      - REDIS_URL=redis://redis:6379/0
      - REDIS_MEDIA_QUEUE=reflow:media_jobs
      - MEDIA_WORKER_CONCURRENCY=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: reflow_postgres
    environment:
      - POSTGRES_USER=reflow
      - POSTGRES_PASSWORD=reflow_password
      - POSTGRES_DB=reflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflow -d reflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: reflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  storage_data:
  postgres_data:
  redis_data:
