[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflow-sdk"
version = "1.0.0"
description = "Official Python SDK for the Reflow Content Operating System Public API."
readme = "README.md"
authors = [
  { name = "Reflow Core Team", email = "developer@reflow.dev" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0"
]
