name: Validate Registry Schema

on:
  push:
    paths:
      - 'registry/**'
      - 'scripts/validate-registry.py'
  pull_request:
    paths:
      - 'registry/**'
      - 'scripts/validate-registry.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Registry Validator
        run: python scripts/validate-registry.py
