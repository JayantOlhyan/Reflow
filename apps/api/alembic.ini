[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = %(here)s/alembic/versions
sqlalchemy.url = postgresql+asyncpg://reflow:reflow_password@postgres:5432/reflow

[post_write_hooks]

[loggers]
keys = root,sentinel,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sentinel]
level = WARN
handlers = console
qualname = sentinel

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
