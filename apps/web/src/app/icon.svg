<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="reflowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#reflowGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="#0B0D12" fill-opacity="0.2" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Flow Loop Ring -->
  <path d="M 256 100 A 156 156 0 1 1 100 256" fill="none" stroke="url(#reflowGrad)" stroke-width="36" stroke-linecap="round" filter="url(#glow)" opacity="0.9" />

  <!-- Center Lightning Bolt -->
  <path d="M 276 130 L 176 270 L 266 270 L 236 382 L 336 242 L 246 242 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
